<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login — PDFo</title><script src='https://cdn.tailwindcss.com'></script><link rel='stylesheet' href='/css/styles.css'><script defer src='/js/app.js'></script></head><body class='min-h-screen bg-[#F8F8F8] flex items-center justify-center p-4'><div class='bg-white rounded-xl p-8 w-full max-w-md'><h1 class='text-3xl font-bold text-center'>Login to PDFo</h1><button class='w-full border rounded py-2 mt-5'>Continue with Google</button><form id='form' class='mt-4 space-y-3'><input name='email' placeholder='Email' class='w-full border p-2 rounded' required><input name='password' type='password' placeholder='Password' class='w-full border p-2 rounded' required><a href='#' class='text-sm text-indigo-700'>Forgot password?</a><button class='w-full bg-[#FF5C5C] text-white py-2 rounded'>Login</button></form><p class='text-sm mt-3'>No account? <a class='text-indigo-700' href='/signup'>Signup</a></p></div><script>form.onsubmit=async(e)=>{e.preventDefault();const fd=Object.fromEntries(new FormData(form));const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)});const d=await r.json();if(!r.ok)return showToast(d.error,'error');localStorage.setItem('token',d.token);location.href='/dashboard'}</script></body></html>
