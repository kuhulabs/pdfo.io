<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Dashboard — PDFo</title><script src='https://cdn.tailwindcss.com'></script><link rel='stylesheet' href='/css/styles.css'><script defer src='/js/app.js'></script></head><body class='bg-[#F8F8F8]'><div class='min-h-screen flex'><aside class='w-64 bg-[#3730A3] text-white p-5 hidden md:block'><p class='text-3xl font-bold'>PDF<span class='text-[#FF5C5C]'>o</span></p><nav class='mt-6 space-y-3 text-sm'><a class='block'>My Files</a><a class='block'>Usage</a><a class='block'>Billing</a><a class='block'>Settings</a><a class='block' href='/login'>Logout</a></nav></aside><main class='flex-1 p-6'><h1 class='text-3xl font-bold'>Dashboard</h1><div class='bg-white p-5 rounded mt-5'><p class='text-sm text-gray-600'>Usage meter</p><p id='usage' class='text-2xl font-bold mt-2'>Loading...</p></div><div class='bg-yellow-100 border border-yellow-300 p-4 rounded mt-4'>Upgrade to Pro for unlimited tools and no ads.</div><div class='bg-white rounded mt-5 overflow-x-auto'><table class='w-full text-sm'><thead><tr class='text-left border-b'><th class='p-3'>Filename</th><th>Tool</th><th>Date</th><th>Status</th></tr></thead><tbody><tr><td class='p-3'>sample.pdf</td><td>Merge PDF</td><td>2026-04-25</td><td>Success</td></tr></tbody></table></div></main></div><script>fetch('/api/user/usage',{headers:{Authorization:`Bearer ${localStorage.getItem('token')||''}`}}).then(r=>r.json()).then(d=>{usage.textContent=d.plan==='free'?`${d.usedToday}/2 files used today`:'Unlimited'}).catch(()=>usage.textContent='2/2 files used today')</script></body></html>
